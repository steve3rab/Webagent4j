<!doctype html>
<html lang="en">
  <head><title>Scoped forms and contexts</title></head>
  <body><main>
    <form aria-label="Billing"><label>Email <input data-target="form-billing-email"></label><button type="button" data-target="form-billing-continue">Continue</button></form>
    <form aria-label="Shipping"><label>Email <input data-target="form-shipping-email"></label><button type="button" data-target="form-shipping-continue">Continue</button></form>
    <form aria-label="Login"><label>Email <input data-target="form-login-email"></label><button type="button" data-target="form-login-submit">Submit</button></form>
    <form aria-label="Newsletter"><label>Email <input data-target="form-newsletter-email"></label><button type="button" data-target="form-newsletter-submit">Submit</button></form>
    <form aria-label="Search"><label>Email <input data-target="form-search-email"></label><button type="button" data-target="form-search-submit">Submit</button></form>
  </main></body>
</html>
