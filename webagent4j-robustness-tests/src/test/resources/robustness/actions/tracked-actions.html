<!doctype html>
<html lang="en">
  <head><title>Tracked actions</title></head>
  <body><main><p id="action-status">Ready</p>
    <button data-target="action-login">Log in safely</button>
    <button data-target="action-cart">Add selected product</button>
    <button data-target="action-modal">Open account modal</button>
    <button data-target="action-save">Save document</button>
    <button data-target="action-send">Send notification</button>
    <button data-target="action-publish">Publish release</button>
    <button data-target="action-confirm">Confirm reservation</button>
    <button data-target="action-download">Prepare download</button>
    <button data-target="action-upload">Confirm upload</button>
    <button data-target="action-finish">Finish workflow</button>
    <script>
      document.querySelectorAll('button[data-target]').forEach(button => button.addEventListener('click', async () => {
        const target = button.dataset.target;
        await fetch('/track?target=' + encodeURIComponent(target), {method: 'POST'});
        document.getElementById('action-status').textContent = 'Executed ' + target;
      }));
    </script>
  </main></body>
</html>
