<!doctype html>
<html lang="en">
  <head><title>Frame replacement</title></head>
  <body><main>
    <iframe id="replace-frame" name="replace-frame" src="/fixture/frames/child-replace-v1.html"></iframe>
    <script>
      function replaceFrame() {
        const old = document.querySelector('iframe[name="replace-frame"]');
        const fresh = document.createElement('iframe');
        fresh.name = 'replace-frame';
        fresh.id = 'replace-frame-2';
        fresh.src = '/fixture/frames/child-replace-v2.html';
        old.replaceWith(fresh);
      }
    </script>
  </main></body>
</html>
