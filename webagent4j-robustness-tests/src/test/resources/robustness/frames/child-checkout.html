<!doctype html>
<html lang="en">
  <head><title>Checkout</title></head>
  <body><main><p id="status">Ready</p>
    <button data-target="frame-001-checkout">Pay</button>
    <script>
      document.querySelectorAll('button[data-target]').forEach(button => button.addEventListener('click', async () => {
        const target = button.dataset.target;
        await fetch('/track?target=' + encodeURIComponent(target), {method: 'POST'});
        document.getElementById('status').textContent = 'Executed ' + target;
      }));
    </script>
  </main></body>
</html>
