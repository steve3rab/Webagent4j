<!doctype html>
<html lang="en">
  <head><title>Decoy</title></head>
  <body><main><p id="status">Ready</p>
    <button data-target="frame-002-decoy">Wrong</button>
    <script>
      document.querySelectorAll('button[data-target]').forEach(button => button.addEventListener('click', async () => {
        const t = button.dataset.target;
        await fetch('/track?target=' + encodeURIComponent(t), {method: 'POST'});
        document.getElementById('status').textContent = 'Executed ' + t;
      }));
    </script>
  </main></body>
</html>
