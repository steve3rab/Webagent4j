<!doctype html>
<html lang="en">
  <head><title>Clean semantic controls</title></head>
  <body>
    <main>
      <h1>Account settings</h1>
      <form aria-label="Profile settings">
        <label for="clean-email">Email address</label><input id="clean-email" type="email" data-target="clean-email">
        <label for="clean-name">Display name</label><input id="clean-name" data-target="clean-name">
        <label for="clean-bio">Biography</label><textarea id="clean-bio" data-target="clean-bio"></textarea>
        <label><input type="checkbox" data-target="clean-terms"> Accept terms</label>
        <label><input type="checkbox" data-target="clean-news"> Product news</label>
        <label><input type="radio" name="plan" data-target="clean-basic"> Basic plan</label>
        <label><input type="radio" name="plan" data-target="clean-pro"> Pro plan</label>
        <label for="clean-country">Country</label><select id="clean-country" data-target="clean-country"><option>France</option></select>
        <button type="button" data-target="clean-save">Save profile</button>
        <button type="button" data-target="clean-reset"><span>Reset</span> <strong>profile</strong></button>
        <button type="submit" data-target="clean-submit">Submit settings</button>
      </form>
      <nav aria-label="Account navigation">
        <a href="#security" data-target="clean-security">Security settings</a>
        <a href="#privacy" data-target="clean-privacy">Privacy settings</a>
        <a href="#billing" data-target="clean-billing">Billing settings</a>
      </nav>
      <button data-target="clean-menu">Open menu</button>
      <button data-target="clean-help">Get help</button>
      <button data-target="clean-export">Export data</button>
      <img src="avatar.png" alt="Current profile picture" data-target="clean-avatar">
      <h2 data-target="clean-preferences">Notification preferences</h2>
      <form aria-label="Search documentation" data-target="clean-search-form">
        <label for="clean-search">Documentation query</label><input id="clean-search" type="search">
      </form>
    </main>
  </body>
</html>
