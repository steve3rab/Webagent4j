    <button>Continue checkout</button><button>Continue checkout</button>

    <button>Save changes</button><button>Save changes</button>
    <button>Send message</button><button>Send message</button>
    <button>Publish article</button><button>Publish article</button>
    <a href="#one">Read details</a><a href="#two">Read details</a>
    <label><input type="checkbox"> Enable feature</label><label><input type="checkbox"> Enable feature</label>
    <label><input type="radio" name="delivery"> Standard delivery</label><label><input type="radio" name="delivery"> Standard delivery</label>
    <button aria-label="Options"></button><button aria-label="Options"></button>
    <button aria-label="Icon action"><svg></svg></button><button aria-label="Icon action"><svg></svg></button>

</html>
