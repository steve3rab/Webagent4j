<!doctype html>
<html lang="en">
  <head><title>Dynamic controls</title></head>
  <body><main><div id="dynamic-host"></div></main>
    <script>
      const names = ['Delayed save','Delayed send','Delayed confirm','Delayed publish','Delayed continue','Replaced cart','Replaced account','Replaced address','Replaced payment','Replaced profile','Stable menu','Stable dialog','Stable search','Stable upload','Stable download'];
      const host = document.getElementById('dynamic-host');
      names.forEach((name, index) => {
        const add = generation => {
          const button = document.createElement('button');
          button.textContent = name;
          button.dataset.target = `dynamic-${index + 1}`;
          button.dataset.generation = generation;
          const previous = host.querySelector(`[data-target="dynamic-${index + 1}"]`);
          if (previous) previous.replaceWith(button); else host.appendChild(button);
        };
        setTimeout(() => add('1'), 40);
        if (index >= 5) setTimeout(() => add('2'), 100 + index * 3);
      });
    </script>
  </body>
</html>
