<!doctype html>
<html lang="en">
  <head><title>Robust login journey</title></head>
  <body>
    <main id="content">
      <h1>Sign in</h1>
      <form aria-label="Account login" onsubmit="login(event)">
        <label for="journey-email">Email</label>
        <input id="journey-email" type="email" autocomplete="username">
        <label for="journey-password">Password</label>
        <input id="journey-password" type="password" autocomplete="current-password">
        <label><input type="checkbox"> Remember me</label>
        <button type="submit">Sign in</button>
      </form>
    </main>
    <script>
      async function login(event) {
        event.preventDefault();
        await fetch('/track?target=journey-login');
        document.getElementById('content').innerHTML =
          '<h1>Dashboard</h1><p role="status">Welcome to your account</p>';
      }
    </script>
  </body>
</html>
