<!doctype html>
<html lang="en">
  <head><title>Dynamic modal journey</title></head>
  <body>
    <main>
      <h1>Account</h1>
      <button onclick="openModal()">Open preferences</button>
      <div id="portal"></div>
    </main>
    <script>
      function openModal() {
        setTimeout(async () => {
          await fetch('/track?target=journey-modal-open');
          document.getElementById('portal').innerHTML =
            '<div role="dialog" aria-label="Preferences"><h2>Preferences</h2>' +
            '<button onclick="closeModal()">Close preferences</button></div>';
        }, 60);
      }
      function closeModal() {
        document.getElementById('portal').innerHTML = '';
      }
    </script>
  </body>
</html>
