name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small repository or complete steps without secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WebAgent4J and Java versions
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Operating system and browser details
    validations:
      required: true
