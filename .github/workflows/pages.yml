name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Javadoc site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same container and build command as ci.yml's "Java 21 / Linux" job, so the aggregate Javadoc
    # published here comes from the identical, already-verified build path (doclint=all,-missing,
    # failOnWarnings=true unchanged) rather than a second, divergent command.
    container:
      image: mcr.microsoft.com/playwright/java:v1.60.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and generate aggregate Javadoc
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Validate aggregate Javadoc output
        run: |
          set -euo pipefail
          test -s target/reports/apidocs/index.html
          grep -q "WebAgent" target/reports/apidocs/index.html
      - name: Prepare Pages staging directory
        run: |
          set -euo pipefail
          mkdir -p target/pages/api/latest
          cp docs-site/index.html docs-site/styles.css target/pages/
          cp -r target/reports/apidocs/. target/pages/api/latest/
      - name: Validate Pages staging directory
        run: |
          set -euo pipefail
          test -s target/pages/index.html
          grep -q "api/latest" target/pages/index.html
          test -s target/pages/api/latest/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
