name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Java 21 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Keep the Playwright container aligned with playwright.version in pom.xml
    # and with the Dockerfile used by the project.
    container:
      image: mcr.microsoft.com/playwright/java:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Java 21 toolchain
        run: |
          java -version
          ./mvnw --version

      - name: Verify standard reactor
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          clean verify

      - name: Verify CLI distribution
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            ./mvnw \
              --batch-mode \
              --no-transfer-progress \
              -q \
              -Dstyle.color=never \
              -DforceStdout \
              help:evaluate \
              -Dexpression=project.version
          )"
          version="$(printf '%s' "$version" | tr -d '\r\n')"

          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -Pdistribution \
            -DskipTests \
            package

          bash .github/scripts/audit-cli-jar.sh \
            "webagent4j-cli/target/webagent4j-cli-${version}.jar" \
            "$version"

      - name: Verify core robustness subset
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Probustness
          -pl webagent4j-robustness-tests
          -am
          -Dscenario=CLEAN-001
          -Dit.test=RobustnessBenchmarkIT
          -Dfailsafe.failIfNoSpecifiedTests=false
          verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
            **/target/action-artifacts/
            **/target/robustness-report.md
            **/target/robustness-report.json
            **/target/robustness-artifacts/
          if-no-files-found: ignore

      # Validate the exact Javadoc generated by the standard reactor on both
      # pull requests and main. No second Maven build is performed for Pages.
      - name: Validate aggregate Javadoc
        run: |
          set -eu
          test -s target/reports/apidocs/index.html
          grep -q "WebAgent" target/reports/apidocs/index.html

      - name: Upload Pages Javadoc
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: pages-javadoc
          path: target/reports/apidocs/
          if-no-files-found: error

  docker:
    name: Docker / non-root smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker test stage
        run: |
          docker build \
            --target test \
            --tag webagent4j:test \
            .

      - name: Build runtime image
        run: |
          docker build \
            --tag webagent4j:pr \
            .

      - name: Smoke-test runtime image
        run: |
          docker run --rm webagent4j:pr version
          docker run --rm webagent4j:pr --help

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write

    concurrency:
      group: pages-publish
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download verified Javadoc
        uses: actions/download-artifact@v5
        with:
          name: pages-javadoc
          path: target/pages-javadoc

      - name: Update persistent Pages state
        run: |
          bash .github/scripts/publish-pages-state.sh             latest             target/pages-javadoc

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages-deploy
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
