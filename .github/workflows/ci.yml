name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Java 21 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Keep the Playwright container aligned with playwright.version in pom.xml
    # and with the Dockerfile used by the project
    container:
      image: mcr.microsoft.com/playwright/java:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Java 21 toolchain
        run: |
          java -version
          ./mvnw --version

      - name: Verify standard reactor
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          clean verify

      - name: Build and audit CLI distribution
        run: bash .github/scripts/build-distribution.sh

      - name: Run CLI JAR audit regression tests
        run: bash .github/scripts/tests/audit-cli-jar.test.sh

      - name: Verify core robustness subset
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Probustness
          -pl webagent4j-robustness-tests
          -am
          -Dscenario=CLEAN-001
          -Dit.test=RobustnessBenchmarkIT
          -Dfailsafe.failIfNoSpecifiedTests=false
          verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
            **/target/action-artifacts/
            **/target/robustness-report.md
            **/target/robustness-report.json
            **/target/robustness-artifacts/
          if-no-files-found: ignore

      # Validate the exact Javadoc generated by the standard reactor on both
      # pull requests and main. No second Maven build is performed for Pages.
      - name: Validate aggregate Javadoc
        run: |
          set -eu
          test -s target/reports/apidocs/index.html
          grep -q "WebAgent" target/reports/apidocs/index.html

      - name: Upload Pages Javadoc
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-javadoc
          path: target/reports/apidocs/
          if-no-files-found: error

  pinned-actions:
    name: GitHub Actions pinned to SHAs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify every workflow action is pinned to an immutable commit SHA
        run: bash .github/scripts/check-pinned-actions.sh

  docker:
    name: Docker / non-root smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker test stage
        run: |
          docker build \
            --target test \
            --tag webagent4j:test \
            .

      - name: Build runtime image
        run: |
          docker build \
            --tag webagent4j:pr \
            .

      - name: Smoke-test runtime image
        run: |
          docker run --rm webagent4j:pr version
          docker run --rm webagent4j:pr --help

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write

    concurrency:
      group: pages-publish
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download verified Javadoc
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pages-javadoc
          path: target/pages-javadoc

      - name: Update persistent Pages state
        run: |
          bash .github/scripts/publish-pages-state.sh             latest             target/pages-javadoc

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/pages-deploy
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
