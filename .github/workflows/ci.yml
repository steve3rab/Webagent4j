name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify standard reactor
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Pci-playwright-deps clean verify
      - name: Verify core robustness subset
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Probustness
          -pl webagent4j-robustness-tests -am -Dscenario=CLEAN-001
          -Dit.test=RobustnessBenchmarkIT
          -Dfailsafe.failIfNoSpecifiedTests=false verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
            **/target/action-artifacts/
            **/target/robustness-report.md
            **/target/robustness-report.json
            **/target/robustness-artifacts/
          if-no-files-found: ignore
