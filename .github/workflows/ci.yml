name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Java 21 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Keep the Playwright container aligned with playwright.version in pom.xml
    # and with the Dockerfile used by the project.
    container:
      image: mcr.microsoft.com/playwright/java:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Java 21 toolchain
        run: |
          java -version
          ./mvnw --version

      - name: Verify standard reactor
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          clean verify

      - name: Verify core robustness subset
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Probustness
          -pl webagent4j-robustness-tests
          -am
          -Dscenario=CLEAN-001
          -Dit.test=RobustnessBenchmarkIT
          -Dfailsafe.failIfNoSpecifiedTests=false
          verify

      # -----------------------------------------------------------------------
      # Diagnostics
      # -----------------------------------------------------------------------

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
            **/target/action-artifacts/
            **/target/robustness-report.md
            **/target/robustness-report.json
            **/target/robustness-artifacts/
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # GitHub Pages
      #
      # Only main builds a deployable Pages artifact.
      #
      # Important:
      # The Javadoc used here is the Javadoc produced by the SAME Maven
      # verification that has just passed above.
      #
      # There is no second Maven build and no second dependency download.
      # -----------------------------------------------------------------------

      - name: Validate aggregate Javadoc
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu

          test -s target/reports/apidocs/index.html
          grep -q "WebAgent" target/reports/apidocs/index.html

      - name: Prepare Pages staging directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu

          rm -rf target/pages
          mkdir -p target/pages/api/latest

          cp docs-site/index.html target/pages/
          cp docs-site/styles.css target/pages/

          cp -r target/reports/apidocs/. target/pages/api/latest/

      - name: Validate Pages staging directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu

          test -s target/pages/index.html
          test -s target/pages/styles.css
          test -s target/pages/api/latest/index.html

          grep -q "api/latest" target/pages/index.html
          grep -q "WebAgent" target/pages/api/latest/index.html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  # ---------------------------------------------------------------------------
  # Deployment
  #
  # This job can only start after the complete verification job succeeds.
  # It does not compile, test or contact Maven Central.
  # ---------------------------------------------------------------------------

  deploy-pages:
    name: Deploy to GitHub Pages

    needs:
      - verify

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5