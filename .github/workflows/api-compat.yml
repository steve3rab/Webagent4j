name: API Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_version:
        description: Published WebAgent4J version to use as the API baseline
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: api-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revapi:
    name: Revapi
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve API baseline
        id: baseline
        shell: bash
        env:
          MANUAL_BASELINE: ${{ inputs.baseline_version }}
          CONFIGURED_BASELINE: ${{ vars.API_BASELINE_VERSION }}
        run: |
          set -euo pipefail

          baseline="$MANUAL_BASELINE"
          if [[ -z "$baseline" ]]; then
            baseline="$CONFIGURED_BASELINE"
          fi

          if [[ -z "$baseline" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "API compatibility is staged but inactive until API_BASELINE_VERSION is configured."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "version=$baseline" >> "$GITHUB_OUTPUT"

      - name: Install current reactor artifacts
        if: steps.baseline.outputs.enabled == 'true'
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -DskipTests
          -Djacoco.skip=true
          -Dmaven.javadoc.skip=true
          install

      - name: Compare supported API against baseline
        if: steps.baseline.outputs.enabled == 'true'
        env:
          API_BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -f webagent4j-api-compat/pom.xml
          -Dapi.baseline.version="${API_BASELINE_VERSION}"
          verify
