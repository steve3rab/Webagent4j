name: Nightly platforms

# A scheduled run always qualifies the active development line, develop
# (1.1.1-SNAPSHOT), regardless of whichever ref this workflow file happens
# to be read from -- every job here checks out develop explicitly for
# schedule. A manual workflow_dispatch run instead checks out the exact
# immutable commit SHA of the dispatched run (github.sha), not a
# branch/tag ref (github.ref) that could move between dispatch and
# checkout, so an exact-head engine qualification can be run against a
# candidate SHA before merge without waiting for the next scheduled
# develop run. Never fall back to whatever the default branch happens to
# be in either case.
#
# Note: GitHub only ever *triggers* the `schedule` event from the
# workflow definition committed on the repository's default branch. This
# file's presence on develop makes the three-engine robustness matrix
# below available to a manual workflow_dispatch run against develop, but
# scheduled nightly runs will not pick up this definition (or any other
# change here) until it also reaches the default branch.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Same rationale as .github/workflows/ci.yml's "verify" job: the official Playwright Java
    # image already contains Chromium and its Linux host dependencies, so this avoids the
    # runtime install-deps -> apt-get -> Ubuntu/Azure mirror path that can hang indefinitely.
    # setup-java still installs and switches to Temurin 21, since the image ships a newer JDK.
    container:
      image: mcr.microsoft.com/playwright/java:v1.62.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Java 21 toolchain
        run: |
          java -version
          ./mvnw --version
      - name: Verify standard reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  verify-other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify on macOS
        if: runner.os == 'macOS'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify

  verify-docker-image:
    name: Verify headless Chromium in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
      - name: Verify headless Chromium in Docker
        run: docker build --target test --tag webagent4j-test .

  robustness:
    name: Full deterministic robustness benchmark / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every engine runs the full 100-scenario corpus independently. fail-fast
    # is disabled deliberately: a Firefox failure must not prevent WebKit (or
    # Chromium) evidence from being collected in the same nightly run, and
    # vice versa -- each engine's qualification evidence stands on its own.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright/java:v1.62.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run full ${{ matrix.browser }} robustness benchmark
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Probustness
          -Drobustness.browser=${{ matrix.browser }}
          verify
      - name: Upload robustness reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: robustness-reports-${{ matrix.browser }}
          path: |
            webagent4j-robustness-tests/target/robustness-report.md
            webagent4j-robustness-tests/target/robustness-report.json
            webagent4j-robustness-tests/target/robustness-artifacts/
            webagent4j-robustness-tests/target/failsafe-reports/
          if-no-files-found: ignore

  robustness-docker-image:
    name: Verify robustness target in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
      - name: Verify robustness target in Docker
        run: docker build --target robustness --tag webagent4j-robustness .
