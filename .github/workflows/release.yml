name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build release artifacts
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease clean verify
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            webagent4j-cli/target/webagent4j-cli-*.jar

  # Maven Central publication will be added when the namespace and external signing credentials exist.
