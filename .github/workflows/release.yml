name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout tag with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve Maven project version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            ./mvnw \
              --batch-mode \
              --no-transfer-progress \
              -q \
              -Dstyle.color=never \
              -DforceStdout \
              help:evaluate \
              -Dexpression=project.version
          )"
          version="$(printf '%s' "$version" | tr -d '\r\n')"

          if [[ -z "$version" ]]; then
            echo "Unable to resolve Maven project version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate tag, version and exact main head
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "Release ref is not a v* tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$tag_version" != "$VERSION" ]]; then
            echo "Tag version '$tag_version' does not match Maven version '$VERSION'." >&2
            exit 1
          fi

          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "Snapshot versions cannot be released: $VERSION" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          tagged_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"

          if [[ "$tagged_sha" != "$main_sha" ]]; then
            echo "Tag must point to the exact current origin/main HEAD." >&2
            echo "tagged SHA: $tagged_sha" >&2
            echo "main SHA:   $main_sha" >&2
            exit 1
          fi

  verify:
    name: Verify release candidate
    needs: [metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    container:
      image: mcr.microsoft.com/playwright/java:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and audit CLI distribution
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/build-distribution.sh

      - name: Build release artifacts
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Prelease
          verify

      - name: Run full robustness suite
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Probustness
          verify

      - name: Inspect release artifacts and aggregate Javadoc
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          cli_jar="target/distribution/webagent4j-cli-${VERSION}.jar"
          cli_checksum="${cli_jar}.sha256"

          test -s "$cli_jar"
          test -s "$cli_checksum"
          test -s target/reports/apidocs/index.html
          grep -q "WebAgent" target/reports/apidocs/index.html

      - name: Prepare release bundle
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          rm -rf target/release-bundle
          mkdir -p target/release-bundle/apidocs

          cp \
            "target/distribution/webagent4j-cli-${VERSION}.jar" \
            "target/distribution/webagent4j-cli-${VERSION}.jar.sha256" \
            target/release-bundle/

          cp -a \
            target/reports/apidocs/. \
            target/release-bundle/apidocs/

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ needs.metadata.outputs.version }}
          path: target/release-bundle/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write

    concurrency:
      group: pages-publish
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download verified release bundle
        uses: actions/download-artifact@v5
        with:
          name: release-bundle-${{ needs.metadata.outputs.version }}
          path: target/release-bundle

      - name: Publish immutable versioned Javadocs
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          bash .github/scripts/publish-pages-state.sh \
            release \
            target/release-bundle/apidocs \
            "$VERSION"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages-deploy
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.metadata.outputs.version, '-RC') }}
          files: |
            target/release-bundle/webagent4j-cli-${{ needs.metadata.outputs.version }}.jar
            target/release-bundle/webagent4j-cli-${{ needs.metadata.outputs.version }}.jar.sha256

  # Maven Central publication will be added separately when the namespace,
  # signing configuration and external publication credentials are available.
