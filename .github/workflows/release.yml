name: Release

# Policy: VERIFY FIRST, PUBLISH LAST.
#
# publish (the only job with contents: write) may run only after metadata,
# verify AND guard have all succeeded. No release -- draft or public --
# should exist for a candidate tag before publish creates one itself. If
# one is found anyway (created out-of-band, manually or otherwise), it is
# never silently accepted as validated, merged into, replaced, or deleted
# automatically: the workflow fails closed and a human must resolve it.
#
# The guard job runs that check early (in parallel with verify) purely as
# a fast-fail signal. publish does not use a single find-or-create/update
# call for the release: GET /releases/tags/{tag} alone cannot prove a
# draft is absent (GitHub does not expose drafts through it), so the
# authoritative check (.github/scripts/check-release-not-published.sh)
# also scans the full releases list, and any ambiguity fails closed. To
# avoid ever silently adopting a concurrently created release, publish
# instead runs an explicit, ID-addressed sequence
# (.github/scripts/release-draft.sh): create a draft only after that
# check passes, immediately re-scan the releases list to confirm this
# run's draft is the only one for the tag, upload the verified assets to
# that exact release id, publish Pages, then finalize that same exact
# release id -- refusing if it is no longer a draft by then. Nothing here
# ever searches "by tag" again once the release id is known, and nothing
# here deletes, replaces, or moves a tag or a release automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout tag with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve Maven project version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            ./mvnw \
              --batch-mode \
              --no-transfer-progress \
              -q \
              -Dstyle.color=never \
              -DforceStdout \
              help:evaluate \
              -Dexpression=project.version
          )"
          version="$(printf '%s' "$version" | tr -d '\r\n')"

          if [[ -z "$version" ]]; then
            echo "Unable to resolve Maven project version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate tag, version and exact main head
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "Release ref is not a v* tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$tag_version" != "$VERSION" ]]; then
            echo "Tag version '$tag_version' does not match Maven version '$VERSION'." >&2
            exit 1
          fi

          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "Snapshot versions cannot be released: $VERSION" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          tagged_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"

          if [[ "$tagged_sha" != "$main_sha" ]]; then
            echo "Tag must point to the exact current origin/main HEAD." >&2
            echo "tagged SHA: $tagged_sha" >&2
            echo "main SHA:   $main_sha" >&2
            exit 1
          fi

  guard:
    name: Guard against pre-existing release
    needs: [metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Refuse to publish over an existing GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/check-release-not-published.sh "$GITHUB_REF_NAME"

  verify:
    name: Verify release candidate
    needs: [metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    container:
      image: mcr.microsoft.com/playwright/java:v1.62.0-noble
      options: --user 1001

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and audit CLI distribution
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/build-distribution.sh

      - name: Build release artifacts
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Prelease
          verify

      - name: Run full robustness suite
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Probustness
          verify

      - name: Inspect release artifacts and aggregate Javadoc
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          cli_jar="target/distribution/webagent4j-cli-${VERSION}.jar"
          cli_checksum="${cli_jar}.sha256"

          test -s "$cli_jar"
          test -s "$cli_checksum"
          test -s target/reports/apidocs/index.html
          grep -q "WebAgent" target/reports/apidocs/index.html

      - name: Prepare release bundle
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          rm -rf target/release-bundle
          mkdir -p target/release-bundle/apidocs

          cp \
            "target/distribution/webagent4j-cli-${VERSION}.jar" \
            "target/distribution/webagent4j-cli-${VERSION}.jar.sha256" \
            target/release-bundle/

          cp -a \
            target/reports/apidocs/. \
            target/release-bundle/apidocs/

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle-${{ needs.metadata.outputs.version }}
          path: target/release-bundle/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [metadata, verify, guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write

    concurrency:
      group: pages-publish
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download verified release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-bundle-${{ needs.metadata.outputs.version }}
          path: target/release-bundle

      - name: Create controlled draft release
        id: create_release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(needs.metadata.outputs.version, '-RC') }}
        run: |
          set -euo pipefail

          release_id="$(
            bash .github/scripts/release-draft.sh create \
              "$GITHUB_REF_NAME" \
              "$GITHUB_SHA" \
              "$PRERELEASE"
          )"

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload verified release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          set -euo pipefail

          bash .github/scripts/release-draft.sh upload \
            "$RELEASE_ID" \
            "target/release-bundle/webagent4j-cli-${VERSION}.jar" \
            "target/release-bundle/webagent4j-cli-${VERSION}.jar.sha256"

      - name: Publish immutable versioned Javadocs
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          bash .github/scripts/publish-pages-state.sh \
            release \
            target/release-bundle/apidocs \
            "$VERSION"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/pages-deploy
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Finalize GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          set -euo pipefail

          bash .github/scripts/release-draft.sh finalize \
            "$RELEASE_ID" \
            "$GITHUB_REF_NAME"

  # Maven Central publication will be added separately when the namespace,
  # signing configuration and external publication credentials are available.
